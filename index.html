<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Houseboat Enquiry Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="top-header">

    <div class="brand">
        <h1>ARONEE TOURS & TRAVELS — HOUSEBOAT ENQUIRY MANAGEMENT SYSTEM</h1>
    </div>

</header>


<!-- =========================================================
     DASHBOARD
========================================================= -->

<section class="dashboard">

    <div class="dashboard-card">
        <span>Total</span>
        <strong id="totalEnquiries">0</strong>
    </div>

    <div class="dashboard-card">
        <span>New</span>
        <strong id="newEnquiries">0</strong>
    </div>

    <div class="dashboard-card">
        <span>Confirmed</span>
        <strong id="confirmedEnquiries">0</strong>
    </div>

    <div class="dashboard-card">
        <span>Cancelled</span>
        <strong id="cancelledEnquiries">0</strong>
    </div>

</section>


<!-- =========================================================
     ENQUIRY FORM
========================================================= -->

<main class="container">

    <form id="enquiryForm">

        <!-- =================================================
             CUSTOMER DETAILS
        ================================================== -->

        <section class="form-section">

            <div class="section-title">
                <h2>Customer Details</h2>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Enquiry ID</label>
                    <input type="text" id="enquiryId" readonly>
                </div>

                <div class="form-group">
                    <label>Enquiry Date</label>
                    <input type="date" id="enquiryDate">
                </div>

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName">
                </div>

                <div class="form-group">
                    <label>WhatsApp Number / Phone Number</label>
                    <input type="tel" id="phone">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Country / Location</label>
                    <input type="text" id="country">
                </div>

            </div>

        </section>


        <!-- =================================================
             HOUSEBOAT ENQUIRY
        ================================================== -->

        <section class="form-section">

            <div class="section-title">
                <h2>Enquiry Details</h2>
            </div>

            <div class="form-grid">

                <!-- Houseboat Name -->

                <div class="form-group">
                    <label>Houseboat Name</label>

                    <select id="houseboatName">

                        <option value="">Select Houseboat</option>

                        <option>Lake Palace</option>
                        <option>Arabian Palace</option>
                        <option>Dream Palace</option>
                        <option>Madhuwahini</option>
                        <option>Dolphin</option>
                        <option>Meadows</option>
                        <option>Rainbow</option>
                        <option>Jalarani</option>
                        <option>Jalakanyaka</option>
                        <option>KL 14</option>
                        <option>Valiyaparamba</option>
                        <option>Bekal Riveria</option>
                        <option>Atlanta</option>
                        <option>Lotus</option>

                    </select>

                </div>


                <!-- Cruise Date -->

                <div class="form-group">
                    <label>Cruise Date</label>
                    <input type="date" id="cruiseDate">
                </div>


                <!-- Check In -->

                <div class="form-group">
                    <label>Check-in Time</label>
                    <input type="time" id="checkInTime">
                </div>


                <!-- Check Out -->

                <div class="form-group">
                    <label>Check-out Time</label>
                    <input type="time" id="checkOutTime">
                </div>


                <!-- Boarding Point -->

                <div class="form-group">
                    <label>Boarding Point</label>

                    <select id="boardingPoint">

                        <option value="">Select Boarding Point</option>

                        <option>Nileshwar</option>
                        <option>Valiyaparamba</option>
                        <option>Kannur</option>
                        <option>Alleppey</option>
                        <option>Kumarakom</option>
                        <option>Kozhikode</option>

                    </select>

                </div>


                <!-- Package Name -->

                <div class="form-group">
                    <label>Package Name</label>

                    <select id="packageName">

                        <option value="">Select Package</option>

                        <option>Sunset Cruise</option>
                        <option>Day Cruise</option>
                        <option>Breakfast Cruise</option>
                        <option>Lunch Cruise</option>
                        <option>Overnight</option>
                        <option>Honeymoon</option>
                        <option>Other</option>

                    </select>

                </div>


                <!-- Adults -->

 <div class="form-group">
    <label>Number of Pax</label>
    <input
        type="number"
        id="totalPax"
        placeholder="Enter number of pax">
</div>
                <!-- Food -->

                <div class="form-group full-width">
                    <label>Food Requirement</label>

                    <textarea
                        id="foodRequirement"
                        rows="2">
                    </textarea>

                </div>


                <!-- Special Requirements -->

                <div class="form-group full-width">
                    <label>Special Requirements</label>

                    <textarea
                        id="specialRequirements"
                        rows="3">
                    </textarea>

                </div>

            </div>

        </section>


        <!-- =================================================
             TARIFF DETAILS
        ================================================== -->

        <section class="form-section">

            <div class="section-title">
                <h2>Tariff Details</h2>
            </div>

            <div class="form-grid">

                <div class="form-group">
    <label>Package Tariff</label>
    <input
        type="text"
        id="packageAmount"
        placeholder="e.g. 10000/- for 8 pax, extra person 800/-">
</div>

                <div class="form-group">
                    <label>Advance Request</label>
                    <input
                        type="number"
                        id="advanceRequest"
                        min="0"
                        placeholder="Enter advance">
                </div>

                <div class="form-group">
                    <label>Discount</label>
                    <input
                        type="number"
                        id="discount"
                        min="0"
                        placeholder="Enter discount">
                </div>

            </div>

        </section>


        <!-- =================================================
             ENQUIRY STATUS
        ================================================== -->

        <section class="form-section">

            <div class="section-title">
                <h2>Enquiry Status</h2>
            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Status</label>

                    <select id="enquiryStatus">

                        <option>New</option>
                        <option>Waiting for Customer</option>
                        <option>Confirmed</option>
                        <option>Not Interested</option>
                        <option>Cancelled</option>

                    </select>

                </div>

            </div>

        </section>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="form-buttons">

            <button type="button" id="saveBtn">
                Save Enquiry
            </button>

            <button type="button" id="updateBtn">
                Update
            </button>

            <button type="button" id="clearBtn">
                Clear
            </button>

        </div>

    </form>


    <!-- =====================================================
         ENQUIRY LIST
    ====================================================== -->

    <section class="list-section">

        <div class="list-header">

            <h2>Houseboat Enquiries</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search enquiry / customer / phone">

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Enquiry ID</th>
                        <th>Enquiry Date</th>
                        <th>Customer</th>
                        <th>Cruise Date</th>
                        <th>Number of Pax</th>
                        <th>Package</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="enquiryTableBody">

                    <!-- Enquiries will appear here -->

                </tbody>

            </table>

        </div>

    </section>

</main>


<script type="module" src="script.js"></script>

</body>
</html>
